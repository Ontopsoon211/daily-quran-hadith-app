name: daily_quran_hadith
description: "A Flutter app for daily Quran and hadith guidance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  http: ^1.1.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_local_notifications: ^14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: IsepMebah
      fonts:
        - asset: assets/fonts/isep_mebah.ttf
